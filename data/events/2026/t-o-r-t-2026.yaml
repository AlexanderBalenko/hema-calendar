description: |-
  Возращение легендарного "лампового" Тюменского турнира!

  Спустя 6 лет мы рады возродить и анонсировать седьмой Тюменский Открытый Рождественский Турнир!

  Турнир состоится 9 и 10 января в г. Тюмени по адресу ул. Валерии Гнаровской 3а (МАОУ СОШ № 70, 2 зал).

  9 января:
  • Рапира Ренессанса
  • Военная сабля

  10 января:
  • Хемакидс (сабля)
  • Шпага, первенство кадеты
  • Шпага, чемпионат
