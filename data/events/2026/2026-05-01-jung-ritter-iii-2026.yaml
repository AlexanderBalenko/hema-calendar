title: Jung Ritter III 2026
starts: 2026-05-01
ends: 2026-05-02
city: Краснодар
organizer: Тарас Верпеко
url: https://vk.com/jungritter
description: |-
  Jung Ritter - турнир по историческому фехтованию для начинающих фехтовальщиков.
  Концепция турнира - возможность соревноваться среди бойцов, чей турнирный стаж не превышает трех лет.

  Турнир проводится в рамках фестиваля по историческому фехтованию ФрайФехтШуле Краснодар 2026/FreiFechtSchule: Krasnodar 2026, в ходе которого пройдут семинары и мастер-классы от ведущих тренеров и наставников, а также непосредственно открытый турнир формата Фехтшуле, расширенный в этом году новыми дисциплинами.
  Фехтшуле: 3 мая 2026 года.
  Семинары и мастер-классы: 25-30 апреля 2026 года.

  Дата проведения 01-02 мая 2026 года.

  Номинации:
  - Длинный меч. Мужчины
  - Длинный меч. Женщины
  - Военная сабля (М и Ж)
  - Рапира Ренессанса (М и Ж)
  - Меч и баклер (М и Ж)
  - HEMAkids сабля.
source: hemagon
