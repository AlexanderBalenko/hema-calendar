description: |-
  Не пора ли испытать себя? Месяцы тренировок, сотни ударов, километры шагов — раз за разом всё глубже погружение в грозное, но завораживающее искусство. Ты уже знаешь: развитие не бывает простым. Поэтому ни с чем не спутаешь то самое чувство: пора проверить, на что ты способен!

  Level One даёт начинающим фехтовальщикам шанс проявить себя. Готов ли ты принять вызов?

  📌 Ждём тебя 11 и 12 марта в Петербурге на турнире Level One: Nordwest 2023.

  Номинации: Длинный меч, Дуэльная сабля, Рапира Ренессанса.

  Место проведения:
  📍Большая Пушкарская, д.10Е, зал CounterTime
