description: |-
  Море, волны и звон мечей.
  Мы приглашаем вас на отборочный турнир по историческому европейскому фехтованию в Краснодаре.

  В соревнованиях могут участвовать бойцы Южного региона, чтобы отобраться на главный Чемпионат России - HEMA RF.

  Ждём вас на «Кубке Черноморья».
