description: |-
  Приглашаем атлетов и клубы принять участие в международном HEMA-турнире Astana Open!

  Astana Open - один из крупнейших турниров по историческому фехтованию в Казахстане, который пройдет уже в четвертый раз!
  В этом году мы ожидаем новых гостей из разных странах, и как обычно — много общения, встреч со старыми знакомыми и захватывающих поединков.

  Когда: 18-19 апреля 2026 г.
  Где: г.Астана

  Дисциплины:
  — Длинный меч: классика
  — Итальянская дуэльная сабля
  — Фехтшуле
