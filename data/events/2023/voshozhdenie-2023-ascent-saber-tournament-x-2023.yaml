description: |-
  Флагманский турнир по дуэльной сабле

  "Only fight matters" - вот что объединяет тех, чья душа отзывается на звон стали.

  Дата проведения: 3-5 ноября 2023
  Место проведения: ФОК "Газпром-Доблести" по адресу ул. Доблести, 15, г. Санкт-Петербург

  На юбилейном турнире будут представлены мужские и женские номинации (без разделения на лиги):

  1. Личная дуэльная сабля, классические правила с афтерблоу - суббота 04.11

  2. Личная дуэльная сабля, правила приоритета по А. Хаттону - суббота 04.11

  3. Командная номинация, правила приоритета по А. Хаттону - воскресенье 05.11

  В пятницу 03.11 вечером состоятся семинары в зале CounterTime на Большой Пушкарской, 10Е

  Следите за новостями: #spbsaber
