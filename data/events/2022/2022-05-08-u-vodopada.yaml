description: |-
  Близится конец сезона. Он был грандиозным, насыщенным на важные мероприятия, было много тренировок и цикл завершается. Пора попробовать свои силы и отработать навыки. Мы приглашаем вас на турнир "У водопада", здесь, гениальный злой умысел в попытке поразить противника столкнется с лучшим детективом, противостоящим резким и опасным выпадам.
  А в ролях будет именно ваш острый ум. Выбирай сторону, снаряд и присоединяйся к последней возможности проверить свои силы так близко к дому в номинациях: Рапира Ренессанса, Военная сабля и Длинный меч.
