description: |-
  Дорогие воительницы, приглашаем вас принять участие в Primavera! В этом году событие пройдет в околофестивальном формате, чтобы не боями едиными... :)

  В городе на Неве состоятся двенадцатые ежегодные соревнования, и помимо сражений вас ждет фотозона, а также два мастер-класса и секретная афтерпати. Вместе с двумя командными и четырьмя личными номинациями это позволит провести весенние выходные в Питере "с огоньком", вне зависимости от погоды!

  Ждем вас в гостях в уютном зале CounterTime на Петроградской стороне по адресу ул. Большая Пушкарская, 10Е.

  📌 Оплату взносов мы начнем принимать с 19.02.25 (среда) через сайт.

  🌹 #Fight_like_a_girl ⚔
