  Турнир для начинающих фехтовальщиков в г. Казань

  Дата проведения: 4-5 апреля 2026 года

  Номинации Level One: Tatarstan 2026:
  Рапира Ренессанса (мужская/женская)
  Федершверт (мужская/женская)
  Дуэльная сабля (мужская/женская)

  Мы приглашаем на Level One фехтовальщиков и фехтовальщиц, чей опыт выступлений не превышает 2х лет!

  Вас ждет много боев, чтобы проверить свои силы и сразиться за победу!

  До встречи в Приволжском Федеральном Округе!
