description: |-
  Школа фехтования SwordMasters представляет турнир Trial.
  Турнир задумывается как площадка, где свои силы смогут испытать фехтовальщики, не имеющие наград выше небольших открытых турниров или соревнований для начинающих.

  Мы предлагаем вашему вниманию две дисциплины и четыре номинации.
  Длинный меч с afterblow (мужской и женский).
  Военная сабля с приоритетом (мужская и женская).


  Полные правила турнира, критерии допуска и прочая организационная информация - в группе ВК.
  Подписывайтесь, следите за обновлениями!
