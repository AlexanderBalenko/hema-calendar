description: |-
  Дамы и господа! Приглашаем на большое фехтовальное мероприятия на майские праздники!

  Встречайте - фестиваль по историческому фехтованию FreiFechtShule: Krasnodar 2025
  Программа фестиваля:
  - 30 апреля-1 мая: пройдут семинары и мастер-классы с нашими гостями из Воронежа, Петербурга. Приезжайте большими делегациями, тренера и новички, ждите новостей в группе Гладиатории.
  - 2 мая: проводим открытый турнир по длинному мечу в двух номинациях. Главным призом станет длинный меч!
