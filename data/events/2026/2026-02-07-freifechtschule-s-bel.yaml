description: |-
  Сабли к бою!

  Чего всегда не хватает саблисту? Конечно же ещё одного турнира по сабле! Ваши желания мы учли, поэтому приглашаем принять участие в нашем новом турнире FreiFechtSchule: Säbel!

  ⚔ Драться и судить
  Уже знакомый формат FreiFechtSchule обеспечит каждого не только большим количеством боёв, но и судейской практикой. На этот раз участников ждут три круга пулов, поэтому азарта битвы хватит на всех! А секретные, но невероятно креативные призы порадуют отличившихся.

  📜 Правила
  Выявлять достойных будем с помощью правил с расширенным приоритетом по Хаттону.
  Главные моменты:
  1. Приоритет выпада над шагом
  2. Шага-выпада над выпадом
  3. Ответа над ремизом.

  Полную версию правил опубликуем позднее, но уже сейчас заявляем: мы за чистые попадания! Поэтому за каждый чистый сход будет начисляться 2 балла, а за выигрыш по приоритету -- только 1.

  ⌛ Место:
  Зал Гильдии Вольных Фехтовальщиков

  Пора приводить в порядок снаряжение с сопротивлением на прокол 350N, чистить саблю от ржавчины и готовиться показывать чистую технику и яркое фехтование!🤺

