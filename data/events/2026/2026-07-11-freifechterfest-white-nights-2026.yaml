title: 'FreiFechterFest: White Nights 2026'
starts: 2026-07-11
ends: 2026-07-12
city: Санкт-Петербург
organizer: Организатор Фехтерры
url: https://vk.com/freifechterfest
description: |-
  Хотели бы вы в разгар межсезонья пофехтовать с большим количеством новых противников в неформальной обстановке на любых видах оружия и по любым правилам?
  Тогда ждем вас в Питере 11-12 июля!

  В программе:
  ◾6 часов открытых поединков под бодрую музыку на основных видах оружия, практикуемых в HEMA, с огромным количеством новых противников!
  Предыдущие FFF посетили более сотни фехтовальщиков со всех уголков страны и даже из-за рубежа!
  ◾Несколько семинаров от ведущих фехтовальщиков и инструкторов!
  ◾Снова турнир с по-настоящему серьезным призовым фондом🐄
  ◾Шикарная питерская погода, как и в любое время года!
  ◾AfterParty в нашем зале!

  🗓11-12 июля 2026 года.

  📍 Санкт-Петербург, набережная Обводного канала, 136, обновленный зал FFG.

  Ваш уровень фехтования абсолютно не имеет значения, если вы готовы получить массу опыта и имеете собственный комплект снаряжения.
