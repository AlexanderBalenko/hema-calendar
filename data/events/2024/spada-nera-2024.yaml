description: |-
  Я закрываю очередную книгу и прикрываю глаза. Немного завидуя героям, обдумываю детали событий, стратегию и тактику боев.

  Из прошлого на меня смотрят образы великих мастеров: Джиганти, Фабриса, де Рады, Альфиери, Каппо Ферро, де Нарваэса, Тибо.

  Кажется, что в шорохе книжных страниц слышатся их голоса советующие, критикующие и направляющие. Можете считать меня дураком, безумцем или мечтателем, но именно так я познаю Историю.

  Через каждое скрещение клинков прикасаясь к прошлому, каждый выпад делает шаг вперёд к пониманию мира и себя.
  Когда-то и все это тоже станет историей. История, в которой есть место и для меня...

  Дамы и Господа, кабальеро и синьорины, мы приглашаем вас принять участие в турнире "Spada Nera", который состоится 13.04.2024 г. в городе Москва. https://vk.com/rapier_tournament
