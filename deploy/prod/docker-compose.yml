# Боевое окружение календаря (calendar.hema.ru). Живёт на сервере в /opt/hema-calendar/,
# поднимается ТОЛЬКО этим файлом — это самостоятельный набор сервисов, а не оверлей над
# dev-compose из корня репозитория.
#
# Отличия от стенда, каждое — осознанное:
#   - никаких build: образы приходят готовыми из registry по тегу IMAGE_TAG;
#   - никаких ports: наружу ведёт только Caddy (deploy/caddy/Caddyfile), он же держит TLS;
#   - у контейнеров явные имена с префиксом calendar-: по ним Caddy их и находит;
#   - все секреты — через ${VAR:?}, ни одного зашитого значения;
#   - база хранится в именованном томе, а не в контейнере.
#
# Схему накатывает человек ДО подъёма новой версии (docs/Deploy.md §4): приложение миграции само
# не применяет — иначе любой перезапуск контейнера менял бы боевую схему.

services:
  postgres:
    image: postgres:17-alpine
    container_name: calendar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?не задана база}
      POSTGRES_USER: ${POSTGRES_USER:?не задан пользователь базы}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?не задан пароль базы}
    # Только петля, не 0.0.0.0: порт нужен миграциям и резервной копии, которые запускаются
    # на самом сервере, и больше никому. Наружу база не смотрит.
    ports:
      - "127.0.0.1:${CALENDAR_PG_PORT:-5433}:5432"
    volumes:
      - calendar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${REGISTRY:?не задан registry}/hema-calendar-backend:${IMAGE_TAG:?какой образ разворачиваем?}
    container_name: calendar-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Host=calendar-postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Ключ модератора. С ним видны контакты заявителей — генерировать длинным и только
      # латиницей: значение заголовка HTTP не принимает кириллицу (проверено смоуком).
      - Admin__Key=${CALENDAR_ADMIN_KEY:?не задан ключ модератора}
      # Запрос приходит через фронт и Caddy, адрес посетителя — в X-Forwarded-For; без этого
      # лимитер заявок считает весь интернет одним клиентом.
      - Proxy__Enabled=true
      # CORS не нужен: браузер ходит на свой origin, в бэкенд его запрос проводит фронт.
      # Переменная оставлена пустой осознанно — если понадобится внешний клиент, список
      # задаётся здесь, а не звёздочкой в коде.
      - Cors__Origins=
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${REGISTRY}/hema-calendar-frontend:${IMAGE_TAG}
    container_name: calendar-frontend
    restart: unless-stopped
    environment:
      - API_URL=http://calendar-backend:8080
      # «Сегодня» для сетки месяца считает сервер: под UTC вечером по Москве подсвечивался бы
      # вчерашний день.
      - TZ=Europe/Moscow
    depends_on:
      - backend

volumes:
  calendar_pg:
