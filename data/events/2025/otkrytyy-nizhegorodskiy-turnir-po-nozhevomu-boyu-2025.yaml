description: |-
  Открытый областной Нижегородский турнир по фехтованию
  (по новому регламенту, объединяющему HEMA и спортивный ножевой бой "Combat Knife")

  Впервые в Нижегородской области проводится турнир, созданный для объединения двух направлений современного боевого искусства — исторического фехтования (HEMA) и спортивного ножевого боя. Новый регламент разработан с целью найти общую платформу между техникой исторических школ и прикладными принципами современного боя, сохранив дух спортивного соперничества и историческую основу фехтовального искусства.

  Организатором соревнований выступает фехтовальный клуб «Орден Меча Аскалон», при поддержке региональных спортивных и культурных объединений.

  Турнир имеет статус областного первенства Нижегородской области и направлен на развитие интереса к фехтованию, популяризацию дисциплин, основанных на исторических и практических боевых традициях, а также укрепление спортивных связей между сообществами HEMA и ножевого боя.

  Участникам предстоит продемонстрировать не только технику и тактическое мышление, но и умение адаптироваться к новым правилам, сочетающим элементы обоих направлений.
