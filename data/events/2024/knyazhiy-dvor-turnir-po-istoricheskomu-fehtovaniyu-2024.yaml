title: Княжий двор — турнир по историческому фехтованию
starts: 2024-08-25
city: Новосибирск
organizer: Александр Коротков
url: https://vk.com/knyazhiydvor
description: |-
  Десятый международный фестиваль исторической реконструкции и исторического фехтования "Княжий двор" пройдет 23, 24, 25 августа 2024 года в ПКиО Заельцовский, г. Новосибирск

  Впервые на базе фестиваля пройдет турнир по историческому фехтованию в номинациях Длинный меч и Рапира Соло. Зрители смогут увидеть бой мечников в средневековом октагоне и дуэлям на рапирах!

  Для участников то прекрасная возможность привлечь к своему хобби новых людей и продемонстрировать свое искусство.

  Участие фехтовальщиков в турнире бесплатное!
