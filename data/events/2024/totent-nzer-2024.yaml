description: |-
  Totentänzer — серия квалификационных турниров, на которых наш клуб проводит квалификацию своих бойцов, мы оцениваем чему научились ребята за прошлый сезон. Также любой участник может попросить сесть за табло или встать угловым судьей, таким образом мы даем спортсменам побыть в роле оргсостава турнира, что позволяет лучше понимать, как нужно вести себя на ристалище.

  В этом году Totentänzer проходит в формате "Open Tournament" и любой желающий может записаться и сразиться с нашими бойцами. Единственным условием участия будет, то что у участников не должно быть призов на турнирах в эшелоне "Advance".

  Номинации турниров будут проходить по выходным:
  18 мая — Рапира и кинжал, начало в 17:00
  19 мая — Длинный меч, итальянский дуэльный кодекс, начало в 17:00
  25 мая — Рапира эпохи Барокко, начало в 17:00
  26 мая — Федершверт, начало в 17:00

  Ждем всех желающих на турнир!
