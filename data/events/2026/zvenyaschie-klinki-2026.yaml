title: Звенящие клинки
starts: 2026-06-13
city: Барнаул
organizer: Тотентанц
url: https://vk.com/totentanz_hema
hemagon_url: https://hemagon.com/tournament/zvenyaschie-klinki
description: |-
  Когда-то давным-давно в Барнауле работала секция фехтования под названием "Звенящие клинки", которая располагалась в центре города. Дети выросли и связали свою жизнь с разными видами фехтования, но секция не пережила начала десятых годов и закрылась. Ее пытались возродить, но это было уже совсем другой коллектив и атмосфера. За это же десятилетие фехтование в Алтайском крае практически умерло, шпага и рапира сейчас не преподается — совсем. Однако, энтузиасты фехтовального движения остались, они изучают историческое фехтование, а сейчас и олимпийское фехтование. Сейчас энтузиасты решили организовать турнир, где вновь зазвенят клинки! Мы представляем смешанный турнир по историческому и олимпийскому фехтованию, Рапира эпохи Барокко и Олимпийская Шпага ждут вас!


  13 июня — Шпага, Рапира Барокко (Девушки), Рапира Барокко (Мужчины).

  Номинация Рапира Барроко пройдет по рулсету Золотого сокола, по правилам Рапира Начинающие (легкая), бой идет в течении 2х минут до набора 5 баллов.
  https://hema-magisterium.ru/rules
  Номинация Олимпийская Шпага пройдет по стандартным правилам, выжимку из правил привели ниже. На нашем турнире поединок длиться 1 период (3 минуты) или же до набора 5 баллов.
  https://docs.google.com/document/d/1dadfBCUvwxwqTLQqjd593WRqhw_6emenH_sEuikIti0/edit?usp=sharing
