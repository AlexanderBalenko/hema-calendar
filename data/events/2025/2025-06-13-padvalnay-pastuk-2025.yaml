description: |-
  Наш клуб покинул стены нашего старого подвала, чтобы переехать в новый. А какое нормальное открытие нового подвала может быть без праздника насилия? Поэтому мы решили сделать небольшой турнир без претензий на эпичность, с судейской магией и петуханской пижнёй.

  Всем пастук!
