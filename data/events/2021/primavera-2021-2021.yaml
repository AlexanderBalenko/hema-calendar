description: |-
  Воительницы, приглашаем вас принять участие в крупнейшем в России женском турнире Primavera.
  История события становится всё длиннее и насыщеннее: этой весной состоятся восьмые по счёту соревнования.
  Боёв будет много и каждый "с огоньком".

  Мы всегда:
  ⚔ собираем лучших из лучших
  ⚔ не ограничиваем количество номинаций, в которых можно принять участие
  ⚔ приглашаем в чистый светлый зал
  ⚔ готовим судей
  ⚔ вручаем достойные призы

  Список номинаций: дуэльная сабля, длинный меч, рапира и дага (личная и командная номинации)

  🌹 Fight like a girl🔪
