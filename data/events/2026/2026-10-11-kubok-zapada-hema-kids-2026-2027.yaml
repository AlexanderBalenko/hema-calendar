description: |-
  Юные шпажисты и саблисты со всех регионов!
  Приглашаем вас на ежегодный открытый турнир по историческому фехтованию для детей и подростков Кубок Запада HEMA kids сезона 2026-2027 в Иваново 🔥

  Номинации:
  ▫️Шпага 9-11 лет (общая)
  ▫️Шпага 12-14 лет (общая)
  ▫️Шпага 15-17 лет (женская и мужская)

  ▫️Сабля 9-11 лет (общая)
  ▫️Сабля 12-14 лет (общая)
  ▫️Сабля 15-17 лет (женская и мужская)

  Место проведения: Шереметевский проспект, 10. Ивановский государственный химико–технологический университет

  Дата проведения: 11 октября 2026

  Скорее подавайте заявки и приезжайте на турнир, где маленькие и уже почти взрослые фехтовальщики попробуют свои силы в бою и встретятся с достойными соперниками! ⚔️
