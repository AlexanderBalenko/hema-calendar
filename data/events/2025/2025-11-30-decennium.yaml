description: |-
  Турнир в честь юбилея клуба "Ангард"
  Регистрация закрыта, 24 ноября в 12.00, оплаты не принимаются.

  Турнир состоится 30 ноября, на базе Фехтовально-Стрелкового Центра «РИФ»,
  До 24 участников в номинации. Число участников может быть расширено по усмотрению организаторов.

  Основные номинации, которые будут на нем представлены:

  Меч-баклер Hema
  Сабля Hema

  Нож
  Катана
  Меч-баклер Soft
  Регистрация в разделы,не относящиеся к HEMA,тут: https://forms.gle/dDpMZcYBUKwV9NTj9

  Правила турнира - в соответствующей вкладке мероприятия.
