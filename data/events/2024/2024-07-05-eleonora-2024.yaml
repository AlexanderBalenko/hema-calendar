description: |-
  Друзья! клубы "Эфес" и "Унтевальден 1480" имеет честь пригласить Вас принять участие в турнире по фехтованию "Элеонора". «Элеонора» 2024

  Этот турнир проводится в честь легендарного тренера Элеоноры Михайловны Крутяковой и приурочен к ее 85-летию.

  Э. М. Крутякова - единственный тренер по фехтованию на юге России, которая даёт уроки как спортивным, так и НЕМА (исторические европейские боевые искусства) фехтовальщикам.

  На соревнованиях будут представлены 4 номинации:
  - Спортивная шпага
  - Военная сабля
  - Рапира и дага
  - Рапира
