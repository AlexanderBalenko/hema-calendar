description: |-
  Хотели бы вы в разгар межсезонья пофехтовать с огромным количеством новых противников в неформальной обстановке на любых видах оружия и по любым правилам?
  Тогда ждем вас в Питере в конце июля!

   Мы представим вам обновленный зал Гильдии Вольных Фехтовальщиков, свежеоборудованный и готовый к приему фехтовальщиков!

   В программе:
  ◾Более восьми часов в открытых поединков под бодрую музыку на всех видах оружия, практикуемых в HEMA с огромным количеством новых противников!
  Предыдущие два FFF посетили более сотни фехтовальщиков со всех уголков страны и даже из-за рубежа!
  ◾Несколько семинаров от ведущих фехтовальщиков Гильдии и не только!
  ◾Снова, турнир с по-настоящему серьезным призовым фондом🐄
  ◾Шикарная питерская погода, как и в любое время года!
  ◾Масштабное HEMA-AfterParty!

  Семинары:
  – мастер-класс Форостовского Р. (шест/baton)
  – мастер-класс Кандата К.О. (рапира)
  – мастер-класс Култаева С. (рубка мечом)
  – мастер-класс Мельникова М. (Пьесы Й. Мейера, длинный меч)
  – мастер-класс Кондратюка С. (С. Фабрис "Рапира & кинжал")
  – мастер-класс Матросова Т. (длинный меч)
  – мастер-класс Некрылова А. (Меч & баклер)


   🗓26-27 июля 2025 года.

   📍 Санкт-Петербург, набережная Обводного канала, 136, обновленный зал FFG.

   Ваш уровень фехтования абсолютно не имеет значения, если вы готовы получить массу опыта и имеете собственный комплект снаряжения.

  Участие в свободных поединках 1500 рублей за день, 2000 за два.
  Участие в одном семинаре - 2000₽
  Ограничение на количество участников в одном семинаре - 30 человек.
  Стоимость семинара Сергея Култаева по рубке - 3000 рублей, ограничение 12 человек.
  Темы семинаров будут объявлены позже.

   ✳Взнос за участие в номинациях "Царь горы" и "Царица горы" 500₽, ограничение на количество участников - 30 человек в каждой из номинаций.
  Правила проведения и призовой фонд будут схожи с прошлогодними.

  Реквизиты оплаты - в группе ВК.
