description: |-
  Cari signori e signorine!

  Мы снова рады приветствовать Вас на, пожалуй, самом изящном, но оттого не менее горячем турнире серии Torneo di scherma.

  🖋 Что ожидает кавалеров и дам меча?

  - Разделение на эшелоны Maestri и Dilettanti. Проход в высшую лигу дают не победы, а уровень техники, тактического превосходства и этикета.
  - Снаряды и правила эпохи М.Паризе. Здесь фехтуют не тяжелыми орудиями для боевых столкновений, а управляемыми легкими саблями.
  - Роскошный зал с почти вековой историей. Дворец культуры - место, где с трепетом относятся к воссозданию обстановки конца XIX - начала XX века и создают особенную атмосферу.
  - Этикет и куртуазность. Это идеальный турнир, чтобы окунуться в ощущение итальянской школы фехтования - изящные манеры, подкрученные усы и куртуазное фехтование с техническими излишествами. Здесь можно позволить себе больше, чем на обычных соревнованиях.

  Регистрация по ссылке: https://goldenfalcon.ru/torneo-di-scherma

  Saluti, amici!
