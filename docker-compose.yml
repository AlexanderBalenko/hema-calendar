# Стенд календаря целиком: своя база, свой API, свой фронт. Портал для работы не нужен —
# в этом и смысл отдельного сервиса (решение заказчика 05.11.2026).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hema_calendar
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
    # 5433 снаружи: порт 5432 на машине разработчика занят базой портала.
    ports:
      - "5433:5432"
    volumes:
      - calendar_pg:/var/lib/postgresql/data

  backend:
    build: ./backend
    # 8085 снаружи: 8080 занят порталом, 8081 — его imgproxy. Порт стенда, на проде за
    # обратным прокси это неважно.
    ports:
      - "8085:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=hema_calendar;Username=calendar;Password=calendar
      - Cors__Origins=http://localhost:3001
      # Браузер ходит в API через фронт, поэтому адрес клиента бэкенд берёт из X-Forwarded-For —
      # иначе лимитер заявок считает всех одним посетителем (см. Program.cs).
      - Proxy__Enabled=true
      # На стенде лимит приёма заявок снят: X-Forwarded-For локально никто не ставит, все
      # заявки падают в одно ведро, и пятый прогон смоука за час упирался в 429. Сам лимит
      # проверяется http-тестом SubmissionRateLimitTests, на проде умолчание (пять в час).
      - Submissions__PerHour=500
      # Ключ модератора — ТОЛЬКО для локального стенда. На проде задаётся своим значением из
      # секретов CI: с этим ключом видны контакты заявителей.
      - Admin__Key=${CALENDAR_ADMIN_KEY:-dev-admin-key}
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    environment:
      # Серверный рендер ходит внутрь сети, браузер — на опубликованный порт (см. src/lib/api.ts).
      - API_URL=http://backend:8080
      # «Сегодня» для сетки месяца считает сервер: под UTC вечером по Москве подсвечивался бы
      # вчерашний день. Аудитория сервиса — русскоязычная, поэтому пояс московский.
      - TZ=Europe/Moscow
    depends_on:
      - backend

volumes:
  calendar_pg:
