description: |-
  ӶΛሃҔΟӃΑ𐍉 ΟСξΗᏏ. ӶΟД ϷΑСПΑДΑ.

  Когда листва начнет гнить, а небо затянет свинцовой пеленой агонии, — в самые мрачные дни октября, в числах третьем и четвертом, врата столицы распахнутся для Кровавой Мессы.

  Мы собираем вас не на турнир. Мы созываем вас на Пир во время Чумы.

  Здесь, среди заплеванных трибун и запаха озона, плоть встретится со сталью. Здесь не будет пощады, ибо мы ищем не победителей, но выживших, чей танец со смертью будет самым прекрасным.
