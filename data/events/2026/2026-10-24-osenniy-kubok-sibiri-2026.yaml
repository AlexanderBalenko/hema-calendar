description: 'Осенний Кубок Сибири — традиционное соревнование по историческому фехтованию, открывающее
  сезон рейтинговых турниров HEMA League в Новосибирске. Участников ждут три номинации: дуэльная сабля,
  дуэльная рапира и фехтшуле. Турнир объединяет фехтовальщиков из разных городов Сибири и даёт старт к
  борьбе за место в итоговом рейтинге Лиги. Победители получают рейтинговые баллы и право участвовать
  в финальном турнире сезона.'
