description: |-
  Турнир по историческому фехтованию (HEMA) «Кубок Золотого Сокола»
  проводится с целью популяризации и развития движения HEMA в России.
  Основными задачами проведения турнира являются:
  - популяризация и развитие HEMA-движения в России;
  - эксперимент с новыми видами номинаций в НЕМА;
  - выявление сильнейших HEMA-фехтовальщиков из числа участников;
  - развитие судейской системы и получение опыта новыми судьями;
  - пропаганда здорового образа жизни и спорта.
