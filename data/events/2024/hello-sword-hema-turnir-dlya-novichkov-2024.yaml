description: |-
  Hello Sword! - пора вывести эту фразу на экраны табло, ведь грядет турнир для начинающих.
  Новички, разгоняйте свои процессоры и выбирайте язык фехтования:

  - Дуэльная сабля
  - Рапира Ренессанса
  - Длинный меч
  - Меч и баклер

  А фехтовальную среду мы обеспечим в Челябинске 3-4 февраля.
