description: |-
  Дамы и Господа, мы ждём вас на третьем турнире серии "Spada Nera"!
  Дата проведения: 22 марта 2025 года.
  Город: Москва.

  Номинации будут представлены следующим образом:
  - Квалификационные бои, по результатам которых будет составлен общий рейтинг участников и их вывод в плей-офф номинации согласно рейтингу.
  Оружие: рапира соло.
  - Бои с разделением участников на эшелоны в зависимости от результатов квалификационного этапа: Basic, Intermediate, Advanced для бойцов мужского пола, Basic и Advanced для бойцов женского пола.
  Оружие для категории Basic: рапира соло.
  Оружие для категорий Advanced и Intermediate: рапира-дага.
