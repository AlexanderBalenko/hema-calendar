description: |-
  «WOLF’S HEART» | Tbilisi | 21-22 February 2026 🐺❤️

  St. George HEMA School invites you to the «Wolf’s Heart» tournament! Prepare your longswords and sabers for a battle to determine the strongest in two categories - beginner and intermediate/open.

  You can register for the Beginner group if your HEMA experience is no more than 2 years and you have no medals from major tournaments (with 20+ participants). This is your moment to shine!
  In the Intermediate/open group, we challenge ourselves in honest combat against the most experienced fighters.

  🤺 Tournament Format: A proven format with group stages followed by a direct elimination bracket. Maximum fights for everyone!

  🏅 The prizes will definitely please you ;)

  Get ready for a battle of hearts and steel! ❤️‍🔥
