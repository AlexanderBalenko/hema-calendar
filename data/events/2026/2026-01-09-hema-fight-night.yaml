description: Турнир для тех, кто проводит день в кругу семьи, а ночью берет меч и горит в пылу битв. Два
  параллельных ристалища, на одном фехтуют длинным мечом, а на другом рапирой с кинжалом. Битва длиною
  в ночь ждет вас! Ламповый турнир, где каждый может примерить на себя роль бойца, судьи или секунданта.
  Никакой спешки, никакого регламента, только бой!
