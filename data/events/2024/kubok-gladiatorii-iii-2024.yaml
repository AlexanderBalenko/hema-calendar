description: |-
  Приглашаем на турнир по историческому фехтованию "Кубок Гладиатории III" в Центр Исторического Фехтования «Гладиатория» г. Краснодар

  Турнир состоится 28 и 29 сентября 2024 года по следующим номинациям:

  День 1. 28 сентября
  - Длинный меч (М) **
  - Длинный меч (Ж)
  - Меч и баклер *

  День 2. 29 сентября
  - Длинный меч: Кодекс Валлерштайн
  - Военная сабля *
  - Рапира и дага *
  - Дюссак

  Примечания:
  * Отдельные женские номинации состоятся при условии, что количество участниц будет не меньше 6 человек. В противном случае номинация проходит в смешанном формате.
  ** Номинация длинный меч пройдёт в двух турах:
  - Первый тур в формате отборочных по системе пулов.
  - Второй тур в формате плейофф с разделением на две категории "А" (Advanced) и "B" (Basic). По результатам отборочных в группу "А" будут выведены не менее 8 бойцов. Оставшиеся бойцы переходят в категорию "B".
