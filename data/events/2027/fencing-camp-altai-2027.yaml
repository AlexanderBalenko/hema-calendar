description: |
  Двухнедельный лагерь на Алтае: ежедневные тренировки по выбранному направлению — длинный меч,
  сабля, рапира, — спарринги, по желанию ОФП и растяжка. Проживание в домиках, четырёхразовое
  питание, два свободных дня в конце.

  Стоимость: только проживание и питание — 50 000 ₽; одно направление — 60 000 ₽, два — 65 000 ₽,
  три — 70 000 ₽. ОФП 4 000 ₽, растяжка 2 500 ₽. Оплата в два этапа: половина до 01.02.2027,
  остальное до 01.05.2027; при полной оплате до 01.02.2027 скидка 3%.

  Тренерам, которые привозят учеников, скидка от 50% (пять учеников) и выше.
  Регистрация по анкете: https://forms.gle/qLNJHFkNfcpPwfUW6
