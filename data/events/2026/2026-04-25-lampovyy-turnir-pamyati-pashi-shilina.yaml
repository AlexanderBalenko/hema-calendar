title: Ламповый турнир памяти Паши Шилина
starts: 2026-04-25
city: Санкт-Петербург
organizer: Валерия Мысленкова
url: https://vk.com/mistral_tournament
description: |-
  Многие из вас помнят наш первый, ещё доковидный, Ламповый турнир с его странными номинациями.
  В память о Паше Шилине мы решили возродить этот праздник старого доброго насилия. Не все лампы горят как прежде, но эта - не погаснет.

   ⌛ Дата:
  25 апреля 2026 года, суббота.
  🌍 Адрес:
  Большая Пушкарская, дом 10Е.

  Турнир проводится в двух номинациях  Классика (военная сабля с афтерблоу) и Остаться в живых (военная сабля по правилам с ограничением здоровья).
  Регистрация продлится до 19.04.2026

  Взносы
  Военная сабля (Классика) - 2500
  Военная сабля (Остаться в живых ) - 1500

  При участии в обеих номинациях действует скидка и взнос составит - 3500
