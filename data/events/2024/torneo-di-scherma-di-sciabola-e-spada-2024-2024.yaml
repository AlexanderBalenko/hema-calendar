description: |-
  Турнир по итальянской дуэльной сабле и рапире по правилам Мазаньелло Паризе (Италия, XIX в)

  Приглашаем вас принять участие и почувствовать дух Италии XIX века.

  Вас ждут правила, основанные на трактате маэстро М.Паризе "Trattato della Scherma di Spada e Sciabola", номинации по сабле и рапире и много хорошего фехтования!
