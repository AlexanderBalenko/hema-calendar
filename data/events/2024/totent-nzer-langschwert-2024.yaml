description: |-
  Totentänzer — серия турниров, на которых наш клуб обучает судей и секретарей, проводит квалификацию фехтовальщиков и отбор бойцов на предстоящие турниры сезона Также любой участник может попросить сесть за табло или встать угловым судьей, таким образом мы даем спортсменам побыть в роле оргсостава турнира, что позволяет лучше понимать, как нужно вести себя на ристалище.

  Второй раз за год Totentänzer проходит в формате "Open Tournament" и любой желающий может записаться и сразиться с нашими бойцами.

  Правила турнира взяты из руллсета правил клуба "Золотой сокол", взяты правила номинации "Длинный меч — Классика"

  Регламент турнира:
  12:00 — Открытие зала, подготовка зала, регистрация гостей и допуск снаряжения.
  13:00 — Открытие турнира, приветственное слово, запуск ристалищ.
  13:10 — Начало женской номинации.
  14:00 — Начало мужской номинации.
  18:00 — Закрытие турнира, награждение победителей.

  Ждем всех желающих на турнир!
