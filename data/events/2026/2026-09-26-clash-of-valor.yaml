description: |-
  Друзья, любители истории и клинков! Мы рады анонсировать грандиозное событие осени — турнир по историческому фехтованию CLASH OF VALOR

  📍 Где: г. Тюмень, ул. Земляной Вал, 10.

  📅 Когда: 26 и 27 сентября 2026 года.

  Вас ждут зрелищные поединки в трех дисциплинах, требующих не только силы, но и филигранной техники:

  🔹 Рапира + Дага - классика дуэльного фетования, где клинок и кинжал работают в унисон.

  🔹 Меч + Баклер - динамика и мощь, вас ждут самые бескомпромиссные поединки.

  🔹 Рапира + Плащ - изящная и опасная номинация. Поединки пройдут в условиях, приближенных к историческим реалиям  - с колоннами по центру ристалища. Тень и опора станут вашими союзниками или противниками.

  🏹 Отдельная номинация - Лучный турнир. Проверьте свою меткость и хладнокровие в стрельбе из традиционного лука.
