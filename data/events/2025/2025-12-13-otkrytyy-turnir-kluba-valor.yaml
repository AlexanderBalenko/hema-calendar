description: |-
  Ждем вас в стенах школы фехтования VALOR!

  Турнир планируется в следующих номинациях:
  - Длинный меч Мужчины*;
  - Длинный меч Женщины;

  *Мужские бои пройдут по системе Valor Double Elimination, где 4-ка финалистов верхней сетки признается победителями Advance, 4-ка финалистов нижней сетки победителями Basic.

  Турнир состоится 13 декабря в г. Тюмени по адресу ул. Николая Чаплина 21 (2 этаж).

  Техническая комиссия снаряжения: 9:00-10:00
  Построение участников и начало турнира: 10:00
