description: |-
  Приглашаем к участию в открытом турнире клуба "Valor".

  Турнир планируется в следующих номинациях:
  - Длинный меч (Basic*, Women);
  - Сабля (Basic*, Women).
  *допускаются спортсмены без опыта участия в этапах плей-офф категории Advanced

  Турнир состоится 25 октября
  в г. Тюмени по адресу ул. Николая Чаплина 21 (2 этаж).

  Техническая комиссия снаряжения: 11:00-12:00
  Построение участников и начало турнира: 12:00
