description: |-
  Per aspera ad astra - через тернии к звездам! Труден путь, но в конце вы получите свой триумф. Наш турнир отдает дань уважения классическому фехтованию XIX века. Фоил, флорет, дуэльная рапира — квинтесенция всего фехтования с многолетней историей, пик развития искусства. Попробуйте редкий для HEMA снаряд, классическую рапиру, мы ждем вас 3го ноября 2024 года в г. Барнаул, в нашем зале по адресу папанинцев 96В. Подробности о турнире будут публиковаться в группе клуба Totentanz с 1 го сентября 2024 года.
  Классическая рапира — это приоритетно!
