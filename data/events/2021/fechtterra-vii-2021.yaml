description: |-
  Гильдия Вольных Фехтовальщиков FreiFechterGilde (FFG) и NF HEMA представляют седьмой ежегодный турнир FechtTerra Санкт-Петербург - самый престижный турнир по длинному мечу в России.

  Место проведения:
  наб. Обводного канала 136, БЦ "Красный Треугольник", проходная №4, 4й этаж, КТ АРЕНА, пешком 12 мин от м. Балтийская.

  Спонсоры:
  SPES
  Kvetun Armory
  Longsword Club

  Номинации:
  - продвинутый длинный меч (категория "А")
  - базовый длинный меч (категория "В")
  - женский длинный меч (категория "W")


