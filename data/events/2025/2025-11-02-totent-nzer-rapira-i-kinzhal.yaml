description: Дорогие друзья, клуб Totentanz объявляет об открытии регистрации на турнир по фехтованию
  рапирой с кинжалом. Турнир пройдет по швейцарской системе в рулсете от Золотого сокола. У вас будет
  максимальное количество боев, а также время чтобы перевести дух между боями и обдумать стратегию для
  своего следующего поединка.
