description: |-
  Турнир для начинающих "Level one: Ural.

  Приглашаем к участию фехтовальщиков, чей стаж выступлений на соревнованиях по НЕМА и дуэльному фехтованию не превышает 3х лет.

  Это турнир для начинающих, где вы в центре внимания. Здесь только опытные судьи и гофмаршалы. И вы можете полностью сконцентрироваться на красивом и качественном фехтовании.

  Наша цель - дать возможность начинающим спортсменам проявить себя и пофехтовать с товарищами своего уровня. Здесь нет громких имен и топов HEMAratings. Это турнир для вас.
