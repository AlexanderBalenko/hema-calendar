description: |-
  Что произойдет, если выпустить на волю своего внутреннего Зверя?

  Почувствуйте в себе скорость королевского гепарда, мощь капского льва и изворотливость королевской гадюки. Присоединяйтесь к турниру для начинающих "Сила Зверя"!

  Мы предлагаем вам направить всю свою энергию в сражение, использовать хищные инстинкты и биться до последнего.
  Но помните, победителем выйдет тот, кто научится управлять своими порывами и взрастит самого опасного хищника - человека.
