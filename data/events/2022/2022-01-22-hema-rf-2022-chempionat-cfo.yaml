description: |-
  Чемпионат ЦФО по фехтованию состоится 22-23 января 2022 года в Москве.

  Вас ждет 3 номинации с делением на эшелоны Men и Women:

  - Рапира и дага
  - Военная сабля
  - Длинный меч

  В соревнованиях могут участвовать бойцы Центрального региона, чтобы отобраться на главный Чемпионат России - HEMA RF. До участия допускаются только совершеннолетние спортсмены.
  Обратите внимание, что вы можете выбрать для участия только 2 номинации.
