description: |-
  Stella Verde — турнир для тех кто хочет получить турнирный опыт, попробовать тот спорт о котором так много говорят его одноклубники. К турниру допускаются бойцы двух категорий:
  1) Занимаются не более 30 месяцев (2,5 года от первого занятия) и не имеют наград на турнирах в базовых и продвинутых эшелонах, возраст от 16 лет.
  2) Бойцы никогда не участвовавшие в турнирах, возраст от 16 лет.

  Допуск достаточно широк по времени занятий, так как мы хотим именно увидеть тех людей кто пропустил "новичковые" турниры в свой первый год, а в более сложных турнирах еще не уаствовал или в них не побеждал. Наш турнир это толчок для тех кто засиделся в звании "Новичка", пора в бой друзья!

  P.S. Записываясь на турнир нужно уведомить организатора через форму записи о участии вас в турнирах, о первом дне занятий и о том есть ли успехи в других видах спорта. Мы поверим вам и не будем перепроверять данные, но если в итоге выясниться, что участник имеет более солидный послужной список то он может быть снят с соревнований и лишен наград.

  Регистрация на турнир: https://forms.gle/ZSeJJLfLddf4GcBS6
