description: |-
  Бойцы готовы? Судьи готовы? Бой!
  Соскучились по этим словам? Мы тоже!

  22 марта 2025 года в Петербурге состоится турнир Katzenkampf под эгидой HEMA TEAM! Пора врываться в наступивший 2025 год с новыми победами!

  Весенний Katzenkampf всегда был новичковым турниром, однако в этот раз размах будет шире обычного – в длинном мече добавится базовая номинация! Бонусом будет общая номинация дюссака, поэтому бои будут динамичными и захватывающими!

  Итак, до события ещё чуть больше двух месяцев – самое время начать усердно тренироваться, чтобы выиграть не только очки рейтинга и уважение коллег по HEMA, но и славные призы.

  Ждём вас на нашем турнире Katzenkampf 2025!
