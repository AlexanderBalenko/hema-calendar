description: |-
  Команда НЕМА TEAM вновь готовится к проведению открытого турнира по длинному мечу и дюссаку - Katzenkampf Octoberfecht 2021.
  В этот раз двери будут открыты для всех желающих в независимости от уровня подготовки- главное наличие необходимой экипировки!

  🐾Ждем всех желающих 30 октября 2021г. в Питере на площадку экспериментов в НЕМА и проверку ваших возможностей фехтовать по разным правилам!

  Как добраться: метро Балтийская, набережная Обводного канала, 136, проходная №4, 4ый этаж, КТ АРЕНА

