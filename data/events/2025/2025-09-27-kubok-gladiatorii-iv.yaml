title: Кубок Гладиатории IV
starts: 2025-09-27
ends: 2025-09-28
city: Краснодар
organizer: Тарас Верпеко
url: https://vk.com/gladiocup
description: |-
  Друзья!

  ЦИФ «Гладиатория» приглашает Вас в г. Краснодар на турнир по историческому фехтованию "Кубок Гладиатории IV 2025".

  Турнир состоится 27 и 28 сентября 2025 года по следующим номинациям:
  - Длинный меч (М) **
  - Длинный меч (Ж)
  - Длинный меч: Кодекс Валлерштайн
  - Меч и баклер *
  - Сабля (по приоритету Хаттона)*
  - Рапира Ренессанса*

  В рамках турнира "Кубок Гладиатории IV 2025" при поддержке фонда Путь меча пройдёт отборочный этап по Южному Федеральному Округу Всероссийского турнира "МЕЧ РОССИИ ХЕМА" в номинациях:
  - Длинный меч (М)
  - Длинный меч (Ж)
  - Сабля (М)
  - Сабля (Ж)
  - Рапира Ренессанса (М)
  - Рапира Ренессанса (Ж)

  Лучшие фехтовальщики в каждой категории получат право принять участие в финале Всероссийского турнира МЕЧ РОССИИ ХЕМА, который состоится в г. Москве в начале декабря. О квотах, точной дате и правилах отбора будет заявлено позже в отдельном сообщении.

  Примечания:
  * Отдельные женские номинации состоятся при условии, что количество участниц будет не меньше 5 человек. В противном случае номинация проходит в смешанном формате.
  ** Номинация длинный меч пройдёт в двух турах:
  - Первый тур в формате общих отборочных по системе пулов.
  - Второй тур в формате пулы+плейофф с разделением на две категории "А" (Advanced) и "B" (Basic). По результатам отборочных в группу "А" будут выведены не менее 8 бойцов. Оставшиеся бойцы переходят в категорию "B".
