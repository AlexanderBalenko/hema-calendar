description: |-
  Турнир по фехтованию "Кубок Сердец"
  Ждем всех неравнодушных к нашему делу принять участие и побороться за пьедестал!

  Номинации:
  - Длинный меч (М/Ж)
  - Военная сабля (М/Ж)
  - Сабля Хаттона (М/Ж)
  - Рапира Ренессанса (М/Ж)
  - Меч и Баклер  (М/Ж)

  Вас ждут:
  -  Мужские, женские и общие номинации
  - Возможность набраться фехтовального опыта
  - Много красочных боев
