description: |-
  Осенний. Яркий. Страстный.
  Чемпионат УрФО - здесь встречаются те, чьи сердца горят фехтованием.

  - Два оружия: сабля и рапира
  - Гибкая система отбора в Basic и Advanced
  - Нет лимита участников - мы проводим турнир на 4 площадках, чтобы смогли поучаствовать все желающие
  - Место встречи - Челябинск, между Центральной Россией и Сибирью
