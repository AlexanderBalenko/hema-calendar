  ⚔️ KHINKALBUR — MAY 17 ⚔️

  An ancient legend foretells: the one who draws the sword from the khinkali shall become the true King of the Sword. Scholars have debated for centuries how exactly this is done without spilling the broth. We have a hypothesis: teamwork might be the key. Grab two good friends, your longswords and come find out on May 17.

  Presenting Khinkalbur — our small in-house team tournament, where victory smells of khinkali, and defeat... also smells of khinkali. Because khinkali are for everyone.

  🏰 Format:
  Teams of 3. One for all, all for broth.

  📅 Date: May 17
  🥟 Khinkali After Party — mandatory part of the programme

  Gather your friends. Raise your swords. Sharpen your appetite.
