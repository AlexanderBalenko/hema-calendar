description: |-
  Открытый чемпионат УрФО по дуэльному фехтованию состоится 21-22 ноября 2020 года в Челябинске.

  Вас ждет 4 номинации с делением на эшелоны Basic, Advanced и Woman:
  - Рапира Ренессанса
  - Военная сабля
  - Длинный меч
  - Меч и баклер

  Подготовку и проведение осуществляет спортивный клуб «Золотой сокол».
