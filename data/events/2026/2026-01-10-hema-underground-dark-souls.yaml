description: В зимних сумерках, когда день мимолетен, а тьма окутывает город, откроется турнир по HEMA.
  Каждый бой будет испытанием воли, выносливости и смелости. Во времена холодов и ветров мы зовём всех,
  кто готов проверить себя и, сразиться за титул Повелителя Пепла. Приди на арену, где прошлые победители
  давно стали легендами, и впиши свое имя в летопись HEMA Underground. Либо ты зажжёшь новый огонь над
  ареной, сам либо станешь пеплом под чужим клинком — выбор будет мгновенный. Санкт-Петербург и клуб CounterTime
  созывает Негорящих на битву.
