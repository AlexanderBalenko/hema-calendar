description: Щит и Меч — это экспериментальный турнир по историческому фехтованию, на котором вам предстоит
  попробовать фехтовать в новом формате. Мы знаем что представители движения реконструкции раннего средневековья
  уже давно проводят турниры, но мы попробуем эту систему немного изменить. Целью турнира мы поставили
  знакомство HEMA сообщества с системой и правилами "Ранятных" турниров. Но в дальнейшим мы будем развивать
  данную тему и привносить элементы HEMA техники в турниры по бою со щитом и мечом.
