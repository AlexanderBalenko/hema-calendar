description: |-
  Турнир по историческому фехтованию "Кубок Гладиатории V" 2026 г. Краснодар

  Турнир приурочен к дню рождение Центра Исторического Фехтования "Гладиатория". В сентябре 2026 года центру исполняется 5 лет.

  Турнир состоится 26 и 27 сентября 2026 года по следующим номинациям для мужчин и женщин раздельно:
  - Длинный меч **
  - Сабля *
  - Рапира и дага *
  - Меч и баклер *
  - HEMAkids: сабля

  В рамках турнира «Кубок Гладиатории V» 2026 при поддержке фонда "Путь Меча" пройдёт отборочный этап Всероссийского турнира "МЕЧ РОССИИ ХЕМА" в номинациях:

  - Длинный меч
  - Сабля
  - Рапира и дага
