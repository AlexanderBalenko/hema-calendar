description: |-
  В сердце земли Нижегородской пробуждается дух древних ристалищ. Созываем мы великих воинов не для усобицы, но для высшей проверки духа и клинка.

  Отозовитесь, ищущие не просто победы, но бессмертной славы в саге о поединке!

  Вас ждут:
  -Меч, Сабля, Рапира
  -Семинары за день до события
  -Два дня турнира
  -Суровый и справедливый рулсет
  -Все прелести открытого турнира

  Вся информация в группе:
  https://vk.ru/grailhema

  Наша встреча еще состоится, воин.
