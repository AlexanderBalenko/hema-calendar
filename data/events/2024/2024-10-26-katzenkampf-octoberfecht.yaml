title: Katzenkampf Octoberfecht
starts: 2024-10-26
city: Санкт-Петербург
organizer: Анастасия Смирнова
url: https://hemagon.com/tournament/katzenkampfoctoberfecht
description: |-
  Начинается новый турнирный сезон в мире HEMA. А это значит, что мир снова окрасится в красный и синий. Скоро мы снова услышим звон мечей, крики судей и гудки таймеров. И конечно же, снова бросим вызов другим бойцам и самим себе.

  И скоро такая возможность выпадет – на турнире Katzenkampf Octoberfecht. Все желающие, независимо от пола и возраста, смогут помериться силой, скоростью и умениями. Много двигаться, усиленно думать, использовать разнообразные техники, превозмогать усталость и боль в борьбе за ̶к̶о̶р̶о̶в̶у̶ победу. Словом, всё то, что мы так любим в хороших турнирах.

  В этот раз на Octoberfecht будет представлен один вид оружия – длинный меч. Зато участников ждёт разнообразие номинаций по стажу. HEMA-движение развивается, опытных фехтовальщиков с каждым годом становится больше, как и новичков. На этот раз каждый боец получит возможность завоевать победу в своей “весовой категории”. А значит, сомнения в сторону – эта битва стоит того, чтобы её выиграть!

  Следите за нашими новостями, чтобы не пропустить информацию о правилах. Мы снова модифицируем их, чтобы сделать картину боёв максимально эффектной и эффективной.
  Группа турнира: https://vk.com/katzenkampfoctoberfecht
