title: Меч Северо-Запада
starts: 2025-10-25
ends: 2025-10-26
city: Санкт-Петербург
organizer: Организатор Фехтерры
url: https://vk.com/mechseverozapada
description: |-
  Меч России приходит в Санкт-Петербург!
  Дорогие друзья!
  25 и 26 октября состоится турнир «Меч Северо-Запада» - отборочный этап всероссийского турнира по историческому бою без доспехов Меч России ХЕМА по Северо-Западному региону.

   Организаторы турнира:
  Гильдия Вольных Фехтовальщиков
  Школа фехтования TRAMAZZONE

   Соревновательные поединки пройдут раздельно в мужской и женской категориях.
  Номинации турнира:
  Длинный меч
  Рапира ренессанса
  Сабля с приоритетом по А. Хаттону.

   Призеры получат возможность защитить честь региона на финальном этапе «МЕЧА РОССИИ ХЕМА».
  ВАЖНО! Турнир является открытыми соревнованиями. Принять участие может любой совершеннолетний гражданин Российской Федерации. Отбор на финальный этап ведется среди представителей Северо-Западного региона, поэтому если призовые места займут представители других регионов, то путевка достанется следующим по рейтингу претендентам.
