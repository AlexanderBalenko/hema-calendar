description: |-
  Воительницы, приглашаем вас принять участие в крупнейшем в России женском турнире Primavera.

  История события становится всё длиннее и насыщеннее: весной 2022 состоятся девятые по счёту соревнования. Боёв будет много и каждый "с огоньком".

  Мы всегда:
  ⚔ собираем лучших из лучших
  ⚔ допускаем во все номинации
  ⚔ приглашаем в чистый светлый зал
  ⚔ приглашаем опытных судей
  ⚔ вручаем достойные призы

  Список номинаций 2022: длинный меч, сабля, рапира с дагой, длинный меч (командный зачет)

  🌹 Fight like a girl ⚔
