description: |-
  Дамы и господа, фехтовальщики!

  Приглашаем Вас в солнечный Краснодар на весенний городской фестиваль по историческому фехтованию ФрайФехтШуле:Краснодар 2026/FreiFechtSchule:Krasnodar 2026, в рамках которого пройдут:
  - Семинары и мастер-классы от ведущих тренеров
  - Групповые тренировки с инструкторами Центр Исторического Фехтования «Гладиатория» | Краснодар , г.Краснодар
  - Индивидуальные тренировки с инструкторами ЦИФ "Гладиатория" г. Краснодар и FFG.
  - Турнир для новичков Юный Рыцарь III/ Jung Ritter III 2026
  - Открытый турнир формата Фехтшуле/FechtSchule, расширенный в этом году новыми дисциплинами.
