description: |-
  Наш фестиваль - это уникальная возможность окунуться в живую историю и познакомиться с культурой исторического фехтования. В этом году Казань примет участников из разных регионов России и множество клубов исторической реконструкции. Мы готовим насыщенную программу: выставки, лекции, показательные выступления, исторические танцы и бои в номинациях Исторических Европейских Боевых Искусств.

  Одним из самых ярких событий фестиваля станет захватывающий турнир, где лучшие бойцы продемонстрируют свои навыки и сразятся за звание чемпиона. Вас также ждут квесты, квизы, музыкальные выступления и множество других интерактивных активностей, которые позволят участникам погрузиться в атмосферу прошлого.

  Подписывайтесь на нашу группу, чтобы быть в курсе всех новостей, узнавать подробности о мероприятиях и не пропустить ни одного интересного события!

  🚩 Вход для всех гостей бесплатный, по регистрации (подписке) в группе фестиваля.
