description: |-
  Приглашаем на осенний FreiFechtSсhule!

  Идея fechtsсhule заключается в том, чтобы предоставить участникам как соревновательную "турнирную" практику, так и судейскую — все заявившиеся бойцы будут включены в судейские бригады и примут участие в судействе в то время, когда сами не будут выступать на ристалище. Регламент будет составлен так, чтобы с одной стороны обеспечить большое количество боёв для каждого участника, а с другой - дать возможность каждому поработать в судействе.
