title: HEMA Kids Кубок Востока
starts: 2024-12-14
ends: 2024-12-15
city: Челябинск
organizer: Golden Falcon Org
url: https://vk.com/hemakidschel?from=search
description: |-
  🗯️ Кубок Востока - это турнир, где юные фехтовальщики покажут, чему научились.

  🔥 Это азарт поединков, кипящие эмоции, интересный вызов и пространство для развития молодых бойцов.

  Когда: 14-15 декабря 2024 года.
  Ждём младших и старших воинов со всех городов России от 6 до 17 лет в городе Челябинск.

  🎗Приезжайте выступать, приезжайте болеть и наслаждайтесь турниром. Здесь вспыхивают таланты, зажигаются новые звезды. И каждый, даже самый юный боец, покорит новую вершину.
