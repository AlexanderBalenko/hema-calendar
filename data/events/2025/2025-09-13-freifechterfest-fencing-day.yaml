title: 'FreiFechterFest: Fencing Day'
starts: 2025-09-13
ends: 2025-09-14
city: Санкт-Петербург
organizer: Организатор Фехтерры
url: https://vk.com/freifechterfest
description: |-
  Хотели бы вы на старте сезона пофехтовать с огромным количеством новых противников в неформальной обстановке на любых видах оружия и по любым правилам?
  Отметить Всемирный День Фехтования?
  Тогда ждем вас в Питере в середине сентября!

  Мы представим вам обновленный зал Гильдии Вольных Фехтовальщиков, свежеоборудованный и готовый к приему бойцов!

  В программе:
  ◾Более восьми часов открытых поединков под бодрую музыку на всех видах оружия, практикуемых в HEMA с огромным количеством новых противников!
  Первые два FFF посетили более сотни фехтовальщиков со всех уголков страны и даже из-за рубежа!
  ◾Несколько семинаров от ведущих фехтовальщиков Гильдии и не только!
  ◾Снова, турнир с по-настоящему серьезным призовым фондом🐄
  ◾Шикарная питерская погода, как и в любое время года!
  ◾Масштабное HEMA-AfterParty!

  🗓13-14 сентября 2025 года.

  📍 Санкт-Петербург, набережная Обводного канала, 134-136-138к63, обновленный зал FFG.

  Ваш уровень фехтования абсолютно не имеет значения, если вы готовы получить массу опыта и имеете собственный комплект снаряжения.
