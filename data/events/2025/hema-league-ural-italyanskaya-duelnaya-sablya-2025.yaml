description: |-
  В сезоне 2025-2026 нас ждет 9 турниров в каждом дивизионе. Каждый турнир проводится на определенном снаряде. Это не просто отдельные соревнования — мы хотим создать серию мероприятий, которая поможет тебе увидеть свой прогресс за сезон.
  Помимо основных турниров, в Лигу войдут командные и личные турниры — “сателлиты”. Их результаты не учитываются в рейтинге, но они отлично подходят для тренировки и набора опыта.
  Мы создали Лигу, чтобы участники могли наслаждаться процессом и получать удовольствие от соревнований. Не зацикливайтесь на победах — главное, чтобы было весело и интересно!
