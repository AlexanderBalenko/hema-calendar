description: |-
  ⚔︎ 💙 Дорогие воительницы, приглашаем вас принять участие в ежегодном женском турнире Primavera!

  ⚔︎ Мы приходим в НЕМА, потому что чувствуем, что нам важно проявить самость – сочетать эффективность и женственность, красоту и силу, точность и напор. И остаемся, когда находим сестер по оружию, для которых это тоже является ценностью.

  Вместе мы проживаем высокую любовь к фехтованию и беззаботное веселье с клинками в руках. Только в боях друг с другом мы развиваем в себе гибкость, уверенность и смелость.

  Регистрация открыта!

  Подробности в группе турнира вконтакте, а также в телеграм-канале TournamentCore.

  До встречи в северной столице!
