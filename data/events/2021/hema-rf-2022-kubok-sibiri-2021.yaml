description: 'Кубок Сибири по фехтованию состоится 11 декабря 2021 года в МНовосибирске. Вас ждет 3 номинации
  с делением на эшелоны Men и Women: - Рапира и кинжал - Военная сабля - Длинный меч В соревнованиях могут
  участвовать бойцы Сибирского региона, чтобы отобраться на главный Чемпионат России - HEMA RF. До участия
  допускаются только совершеннолетние спортсмены. Обратите внимание, что вы можете выбрать для участия
  только 2 номинации.'
