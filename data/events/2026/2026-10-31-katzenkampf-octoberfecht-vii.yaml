description: |-
  ⚜️KATZENKAMPF OCTOBERFECHT⚜️
  🗡️🗡️🗡️Nur ein langesschwert!🗡️🗡️🗡️

  Мы знаем - вы ждали!
  В канун Дня Всех Святых, 31 октября, состоится Katzenkampf Octoberfecht, где мы снова увидим страшно красивое фехтование.

  В этом году турнир пройдет в трёх номинациях и будет посвящен только длинному мечу.
  Мужская и женская номинация - личное первенство, без ограничений по опыту.
  А также мы обещали вам необычную номинацию - и это парная номинация для мужчин и женщин.

  🔸Что это такое?
  В номинации участвуют команды (пары), состоящие из мужчины и женщины.
  В командной встрече мужчины фехтуют с мужчинами, женщины с женщинами. Счёт сквозной, побеждает пара, набравшая наибольшее количество баллов по истечению времени, либо максимально возможное для боя.
  Объединяйтесь в команды, будет интересно!

  🔸Порядок номинаций:
  Парная номинация
  Женская номинация
  Мужская номинация

  Как всегда, ждём вас в Санкт-Петербурге, обещаем приятную атмосферу и традиционно самый красивый мерч⚜️
