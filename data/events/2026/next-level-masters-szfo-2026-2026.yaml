description: |-
  Добро пожаловать на командные соревнования для "играющих тренеров" и их лучших учеников! Next Level - это открытые соревнования, на которых мы будем рады видеть команды, в состав которых входят как более опытные и именитые спортсмены, так и представители следующего поколения хемаистов.

  Турнир "Следующий уровень" - это школа жизни через становление в фехтовании, через преемственность. Вы здесь, чтобы показать свой исторический максимум и уйти домой не просто с трофеями, а пройдя посвящение, которое однажды проходят все те, кто готов играть в долгую.

  ▪первая волна регистрации — 05.05 (вт) - 11.05 (пн) до 22:00
  ▪вторая волна регистрации — 12.05 (вт) - 01.06 (пн) до 22:00
