description: |-
  Нам пришлось отменить серьезный кубок Сибири, взамен проводим более ламповую номинацию

  🔥 ВОТ ЭТА ТВОЯ САБЛЯ ПАРИЗЕ, ЧТО ЛЬ? ТУРНИР С ВАЙБАМИ ЗОВЁТ! 🔥

  — Какая у тебя сабля-то, Паризе что ль?
  — Так я ж итальянец!
  — Да ну!
  — Чё, не веришь, что ли?
  — Нет.
  — Честное слово! (Показывает саблю Паризе от Pike Armory)

  Ну что, поверим на слово? Пришло время собрать свою банду и доказать, что ваша команда достойна не только дуэльных клинков, но и легендарных генеральских котлов

  ПОЧЕМУ ЭТО БУДЕТ ОГОНЬ?
  Это же турнир с вайбами Паризе! Здесь можно (и нужно!) то, что на обычных соревнованиях остаётся за кадром:

  Бить обратным лезвием на сабле — да-да, вы не ослышались!
  Сходиться в кор-а-кор (пока вы, конечно, пытаетесь фехтовать, а не просто мешаете друг другу).
  Отточить до блеска свою атаку — в том числе и на скрестном шаге.
  В остальном, турнир проходит по стандартным правилам (подробности Гл. 3, п. 2.6. Правила Исторического Фехтования)

  👥 ФОРМИРУЕМ ЛЕГИОН:
  Чтобы встать в строй, итальянским генералам нужна команда из 3 человек + 1 запасной.
  ❗️В командной встречи с каждой стороны должно быть не больше 1 девушки.
  Хотите максимум драйва и атмосферы? Собирайте команду на обе номинации! Запасной игрок как раз для этого. (Меняться вы можете в любой момент перед командной встречей, сколько угодно раз)
