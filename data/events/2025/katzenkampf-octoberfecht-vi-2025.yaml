description: |-
  Сквозь шум мегаполиса, где гул автомобилей переплетается с многоголосым гомоном толпы, пронзительным эхом разносится зов горна. Он звучит всё отчётливее, заставляя забыть о рутине и устремиться навстречу неизведанному. HEMA TEAM объявляет о приближении Katzenkampf OctoberFecht!

  Отвлекитесь от экранов и наскучивших дел. Оставьте позади пиксельные баталии и философские споры. Здесь, на арене Katzenkampf Octoberfecht, твоя страсть к фехтованию обретёт новую форму – форму стали и ярости.

  Наши номинации в этом году:
  • "Длинный меч, Advanced", мужчины и женщины. Докажи, что ты – истинный мастер клинка!
  • "Длинный меч, Basic", мужчины и женщины. Сделай первый шаг на пути к фехтовальной славе!
  • "Копьё", мужчины и женщины. Преврати оружие в продолжение своей воли.

  Здесь тебя ждут не только бескомпромиссные поединки, но и по-настоящему комфортная атмосфера, достойные соперники и ценные призы, которые согреют душу настоящего воина или воительницы.

  Готовы принять вызов? Наточите свои когти и следите за новостями – регистрация откроется совсем скоро! Приготовьтесь к Katzenkampf OctoberFecht – турниру, который не захочется пропустить!
