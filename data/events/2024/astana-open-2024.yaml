description: |-
  Сәлем, бойцы!
  Мы приглашаем вас на второй турнир Astana Open. Будет много боев, дружелюбная атмосфера и посиделки после.
  Вас ждут номинации:

  ☀Длинный меч, Классика
  ☀Длинный меч, Судебный поединок
  ☀Военная сабля, правила по А.Хаттону

  Все номинации делятся на женские W и мужские M. Разделение на Advanced и Basic проводится при количестве участников от 24.

  Турнир пройдет в Астане 16-17 марта.
  Записывайте в календарь :) Совсем скоро мы откроем регистрацию, выложим Положение и Правила.

  Мы сами бойцы и ценим хороший бой. Мы делаем турниры так, чтобы на них было классно фехтовать. А для этого нужно пригласить хороших людей и чтобы им тоже было классно.
