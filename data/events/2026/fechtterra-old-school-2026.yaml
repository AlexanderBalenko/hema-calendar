description: |-
  Дата: 21-22 февраля 2026г.
  Место: зал Гильдии по адресу: СПб, наб. Обводного канала 136 к.1Б

  Вас ожидают:

  - два дня турнира!
  - номинации «длинный меч & рондель» и «меч & баклер».
  - две новые номинации «мессер» и «рубка длинным мечом»!
  - олдскульный скандинавский рулсет 2015-20гг с приоритетом старшей зоны(когда попадания считаются сообразно зоне вне зависимости от темпа). Классическая система с остановкой бойцов после попадания и афтерблоу.

  Вся информация в группе ВК: https://vk.com/fechtterra_oldschool
