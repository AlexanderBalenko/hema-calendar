title: Мастер Клинка XXI
starts: 2020-01-31
ends: 2020-02-02
city: Первоуральск
organizer: Golden Falcon Org
hemagon_url: https://hemagon.com/tournament/blademaster
description: |-
  "Мастер клинка" – турнир для крепких духом людей.

  Сильные и умелые бойцы из разных регионов встречают здесь достойных противников.
  Десяток различных номинаций, семинары и обсуждение новых правил, техник и номинаций, площадка для взаимодействия и общения бойцов из разных концов страны - все это "Мастер Клинка".

  Соревнования проходят в Первоуральске в ФОК "Гагаринский".

  Организацией турнира, проживания, питания, трансфера от города до базы занимается спортивный клуб «Золотой Сокол».

  30 января -  Заезд и размещение гостей
  31 января - 2 февраля - Соревнования
  3 февраля - Отъезд

  Приглашаем Вас принять участие в одном из самых масштабных турниров России по дуэльному фехтованию «Мастер Клинка 2020»!
