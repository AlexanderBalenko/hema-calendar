description: |-
  Господа и дамы! С огромной радостью приглашаем Вас принять участие в турнире «Элеонора» 2026!

  Этот турнир проводится в честь знаменитого тренера Элеоноры Михайловны Крутяковой и приурочен к ее 87-летию. Для нашего сообщества весьма приятно, что Элеонора Михайловна даёт уроки как спортивным, так и НЕМА-фехтовальщикам.

  HEMA-номинации турнира.

  4 июля:
  - «Рапира Ренессанса с кинжалом» (общая)
  - «Рапира Ренессанса соло» (общая)

  5 июля:
  - «Длинный меч» (женщины)
  - «Длинный меч» (мужчины)
  - «Военная сабля» (женщины)
  - «Военная сабля» (мужчины)
