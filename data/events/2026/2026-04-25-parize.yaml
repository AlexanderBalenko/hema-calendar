description: |-
  Турнир по историческому фехтованию (HEMA) на саблях и рапирах «Torneo
  discherma di sciabola e spada» проводится с целью популяризации и развития
  движения HEMA в России.
  Турнир «Torneo di scherma di sciabola e spada» является продолжением
  исторического исследования клуба «Золотой Сокол». В рамках данного
  эксперимента будет исследовано влияние формата проведения отборочно этапа,
  а также эшелона maestri на технику фехтования на легких саблях и рапирах.
  Основными задачами проведения турнира являются:
  ● Презентация системы отборочного этапа и эшелонирования;
  ● Проверка адаптации участников сообщества к сабельным и рапирным
  правилам по учебнику М. Паризе;
  ● Пропаганда здорового образа жизни и спорта;
  ● Популяризация HEMA-движения в России.
source: hemagon
