description: |-
  Приглашаем маленьких, фехтовальщиков побольше и почти совсем взрослых фехтовальщиков на главное событие Нового года - турнир HEMA PANDA!

  Приготовьтесь к фехтовальным поединкам, где смелость, ловкость и немного удачи встречаются на одной дорожке!
  Будущие чемпионы смогут продемонстрировать свои навыки, а мы обещаем море эмоций, общения и, конечно же, захватывающих моментов!

  Номинации проводятся без электрофиксации
