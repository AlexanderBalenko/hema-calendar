title: Black Saber Tournament 2024
starts: 2024-12-14
ends: 2024-12-15
city: Москва
organizer: Олег Колганов
url: https://vk.com/black_tournament
description: |-
  Мы с радостью анонсируем четвертый ежегодный турнир "Black Saber" по военной сабле!
  Даты проведения: 14-15 декабря 2024 года.

  В этом году турнир пройдёт в два этапа и в два дня.

  Первый этап: квалификационные бои, по итогам которых будет составлен общий рейтинг участников.

  Второй этап: бои с разделением участников на эшелоны и группы строго в зависимости от результатов квалификационного этапа.


  Подробнее про этапы.
  В первой части каждый участник получит возможность пофехтовать в "общей" части, куда войдут бойцы всех уровней подготовки
  Для одних это будет возможностью набраться опыта с сильными оппонентами, для других - возможность побороться за место в более высоком эшелоне, для третьих - возможность пофехтовать с оппонентами ,с которыми ранее не встречались.

  По результатам боев первого этапа будет сформирован второй этап.
  Участники будут распределены по эшелонам, в котором вновь будут сформированы группы, по результатам боев в которых пройдут бои на выбывание.
  Здесь участники смогут встретиться с теми, кто именно на этом турнире показал сравнимый с ними уровень подготовки, невзирая на прошлые регалии.

  Предварительный набор эшелонов второго этапа:

  Mужчины (Basic)
  Мужчины (Intermediate)
  Мужчины (Advanced)

  Женщины (Basic)
  Женщины (Advanced)
  Возможно проведение эшелона "Женщины (Intermediate)" при получении большого количества заявок
