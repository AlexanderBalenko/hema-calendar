description: Турнир для новичков, посвящённый развитию HEMA в России и объединяющий спортсменов, стремящихся
  проявить себя в искусстве исторического фехтования. Участников ждут новые номинации, яркие поединки
  и возможность испытать свои силы. Турнир также станет площадкой для повышения уровня судейского мастерства
  и популяризации активного образа жизни.
