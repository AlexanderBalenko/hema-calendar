  Когда зима уступает весне, наступает время долгожданного турнира - "Эпичные битвы".

  Соревнования в индивидуальном зачёте всех основных категорий-НЕМА:
  ⚔️Сабля,
  ⚔️Рапира и дага,
  ⚔️Длинный меч,
