description: |-
  Море, волны и звон мечей.
  Мы приглашаем вас на турнир по историческому европейскому фехтованию в Сочи.
  Вас ждёт по-настоящему много поединков: три вида оружия, бои в группах с каждым противником.

  Организаторы турнира – спортивный клуб «Золотой Сокол».
  У нас огромный опыт за плечами: ежегодные региональные и окружные турниры, три успешно проведённых Чемпионата России по историческому фехтованию «Мастер Клинка», сильные судейские бригады.

  Регистрируйтесь по ссылке: https://vk.cc/ayUWJ2
