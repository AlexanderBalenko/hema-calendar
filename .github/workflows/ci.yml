# Полный прогон на каждый push и pull request.
#
# Три слоя, каждый о своём:
#   * данные — YAML-файлы календаря: схема, справочники, дубли (этим гейтом турнир и попадает
#     в календарь: пул-реквест с кривым файлом не вливается);
#   * юнит-тесты фронта — чистая логика: раскладка месяца, разбор адреса, отбор турниров;
#   * браузерный смоук — собранный сайт в настоящем браузере.
#
# Выкладка на Pages ждёт этот прогон целиком (pages.yml, needs: tests).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: {}

jobs:
  data:
    name: Данные календаря
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Проверка YAML
        run: python scripts/validate_data.py

  frontend:
    name: Юнит-тесты фронта
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: node --test
        working-directory: frontend
        # Зависимости не нужны: проверяемые модули чистые, без импортов из node_modules.
        run: node --experimental-strip-types --test "src/**/*.test.ts"

  site:
    name: Сборка и браузерный смоук
    runs-on: ubuntu-latest
    needs: [data, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: pip install pyyaml
      - name: Собрать данные сайта
        run: python scripts/build_json.py

      - name: Собрать сайт
        working-directory: frontend
        # Сборка с подкаталогом — ровно такая, какая уезжает на Pages: без него ломается
        # только опубликованная версия (так пропали пиктограммы оружия, адрес маски шёл в
        # корень сайта).
        env:
          PAGES_BASE_PATH: /hema-calendar
          NEXT_PUBLIC_BASE_PATH: /hema-calendar
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Смоук
        env:
          E2E_BASE_PATH: /hema-calendar
        run: sh scripts/e2e-smoke.sh
