description: |-
  Дата:
  • 17-18 февраля 2024 года

  Вас ожидают:
  • длинный меч & кинжал-рондель (М и Ж)
  • меч & баклер (М и Ж)

  Длинный меч по экспериментальным правилам с возможностью использовать кинжал-рондель, закреплённый на поясе.
  Кинжалы и пояса с ножнами будут предоставлены организаторами. Также возможно использование собственных, если они будут соответствовать заявленным ТТХ.

  Многими любимый Меч & баклер, который редко встречается на турнирах в РФ, внесём свой очередной вклад в развитие этой номинации и порадуем вас.

  Вся информация в группе ВК: https://vk.com/fechtterra_oldschool
