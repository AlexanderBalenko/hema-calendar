description: |-
  Пусть за окном слякоть и ветер, но в зале 28 марта будет жарко от накала страстей и звонких ударов клинков. HEMA TEAM представляет фехтовальную оттепель сезона!

  Katzenkampf станет первым ярким событием для новичков и поводом для тёплой встречи опытных бойцов:

  🔥 Длинный меч, новички – яркий огонь первой битвы и первых достижений.
  ⚡ Длинный меч, Basic – высокая температура мастерства опытных фехтовальщиков.
  💥 Дюссак – обжигающая напористость всех, кто осмелится взять в руки это оружие.

  Это идеальное место, чтобы растормошить свои навыки от зимней спячки.

  Для нас этот турнир — не просто соревнование, а долгожданное событие, в которое HEMA TEAM вкладывает душу.
  Мы создаём Katzenkampf специально для вас: для тех, в чьём сердце горит огонь любви к фехтованию, кто только начинает или продолжает свой турнирный путь и готов его пройти вместе с нами.

  Участников ждёт по-настоящему тёплая атмосфера, поддержка болельщиков, уважение соперников и, конечно, достойные призы от наших спонсоров, которые согреют душу истинного бойца.

  Готовы встретить весну с оружием в руках?
  Скоро откроется регистрация — следите за новостями, готовьте снаряжение и свою волю к победе!

  Главное — горите!
  (но не выгорайте)

  28 марта. Katzenkampf. Согреем Питер вместе.
