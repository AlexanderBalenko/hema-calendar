description: Турнир, созданный для объединения в одном месте и времени тех, кто любит идеально подготовленные
  атаки, точные рипосты и безответные контратаки. Наши клубы отличаются, мы учились у разных тренеров,
  наши излюбленные действия не те же, что "коронные" приемы соперника. Но в одном мы безусловно едины
  — пониманием, почему сабельное фехтование снискало свою славу. Мы знаем, почему этот огонь в сердце
  может гореть вечно и в чем заключается та характерная красота сабельного боя.
