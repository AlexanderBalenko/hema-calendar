title: FreiFechtSchule 2025
starts: 2025-01-18
city: Санкт-Петербург
organizer: Организатор Фехтерры
url: https://vk.com/freifechtschule
description: |-
  Гильдия Вольных Фехтовальщиков представляет свой новый экспериментальный проект — FreiFechtShule.

  Цель мероприятия заключается в том, чтобы предоставить участникам как соревновательную "турнирную" практику, так и судейскую — все заявившиеся бойцы также будут включены в судейские бригады и примут участие в судействе в то время, когда сами не будут выступать на ристалище. Регламент будет отличаться от стандартного турнирного для того, чтобы обеспечить, с одной стороны, большее, нежели на обычном турнире, количество боёв для каждого участника, а с другой, дать возможность каждому поработать в судействе.
source: hemagon
