description: |-
  Леди и джентльмены! Клубы «Эфес» и «Унтевальден 1480» имеют честь пригласить Вас принять участие в турнире по фехтованию «Элеонора» 2025.

  Этот турнир проводится в честь легендарного тренера Элеоноры Михайловны Крутяковой и приурочен к ее 86-летию.

  Э. М. Крутякова - единственный тренер по фехтованию на юге России, которая даёт уроки как спортивным, так и НЕМА-фехтовальщикам.

  На соревнованиях будут представлены 4 номинации:
  - Спортивная шпага
  - Рапира Ренессанса с кинжалом
  - Рапира Ренессанса
  - Длинный меч
  - Военная сабля
