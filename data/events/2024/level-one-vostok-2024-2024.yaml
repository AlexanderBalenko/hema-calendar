description: |-
  Турнир для начинающих фехтовальщиков Level One впервые пройдет на Дальнем Востоке!

  Номинации:
  - Дуэльная сабля, мужская
  - Дуэльная сабля, женская
  - Длинный меч, мужской

  В программе также будут представлены три семинара по таким дисциплинам НЕМА, как:

  - судейство 31 мая 2024 (пт)
  ведет Александр Страхов

  - дуэльная сабля 1 июня 2024 (сб)
  ведет Андрей Музурин

  - длинный меч 2 июня 2024 (вс)
  ведет Елена Музурина

  Для подготовки хорошего фехтовальщика, который хочет быть первым и лучшим, нужно не только много и усердно тренироваться, но и иметь большой соревновательный опыт.

  Турниры Level One — прекрасная возможность получить опыт состязаний, подвести итог соревновательного сезона, получить свою первую медаль!

  До встречи в Хабаровске в первые дни лета!
