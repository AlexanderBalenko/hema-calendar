title: Открытый меч Москвы
starts: 2025-04-26
ends: 2025-04-27
city: Москва
organizer: Александр Рябов
url: https://vk.com/moscowopensword
description: |-
  Номинация длинный меч (фехтшуле) с разделением на мужскую и женскую категории в первый соревновательный день.
  Больше поединков, возможность попробовать необычные интересные правила, а также испытать свои силы против оппонентов разного уровня.

  Номинация длинный меч (afterblow) с разделением на категории A и B среди мужчин, без разделения среди женщин во второй соревновательный день.
  Проверенные временем правила и система проведения соревнований, позволяющие как дать необходимый турнирный опыт участникам, так и достоверно выявить сильнейших.

  26-27 апреля, Москва.
  Организаторы - школа фехтования SwordMasters.
