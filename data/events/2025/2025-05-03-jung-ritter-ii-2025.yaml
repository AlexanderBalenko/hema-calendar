description: |-
  Jung Ritter - турнир по историческому фехтованию для начинающих фехтовальщиков.
  Концепция турнира - возможность соревноваться среди бойцов, чей турнирный стаж не превышает трех лет.

  Турнир проходит в городе Краснодаре, в центре исторического фехтования "Гладиатория"

  Дата проведения 02-03 мая 2025

  Номинации:
  - Длинный меч. Мужчины
  - Длинный меч. Женщины
  - Военная сабля
  - Рапира и дага
  - Меч и баклер
  - Дюссак
