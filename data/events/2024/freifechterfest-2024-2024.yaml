description: |-
  Более восьми часов открытых боев на всех видах оружия, практикуемых в HEMA с огромным количеством новых противников!

  Суббота (14 сентября)
  11:00-12:30 Семинар Кирилла Орестовича Кандата (рапира)
  12:30-14:00 Семинар Александра Рябова (меч и баклер)
  14:00-18:00 Открытые бои

  Воскресенье (15 сентября)
  11:00-12:30 Семинар Сергея Култаева (длинный меч, рубка)
  11:00-12:30 Семинар Андрея Музурина (рапира)
  12:30-14:00 Семинар Романа Форостовского (французская трость)
  14:00-18:00 Открытые бои

  Стоимость участия - 1000 рублей за день, 1500 за два.
  Стоимость семинара - 2000 рублей, ограничение 30 человек.
  Стоимость семинара Сергея Култаева по рубке - 3000 рублей, ограничение 12 человек.

  14-15 сентября 2024 года.
  Санкт-Петербург, набережная Обводного канала, 136, СК "Арена"
