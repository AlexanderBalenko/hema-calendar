description: |-
  Кубок Центральной Азии - самый большой турнир по HEMA в регионе, который пройдёт в городе Алматы, Казахстан!

  Номинации:
  - Длинный меч (классические правила)
  - Английская Гимнастическая сабля (Сабля Хаттона)
  - Рапира соло (тяжелая)

  We are happy to invite you to the first large HEMA tournament in Central Asia, which will take place on October in Almaty, Kazakhstan.

  The tournament will have "Men. General" and "Women. General" categories. And the following categories:
  - Longsword: classic
  - English Gymnastic Sabre (Hutton's saber)
  - Rapier solo
