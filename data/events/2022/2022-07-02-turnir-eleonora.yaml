description: Друзья! Мы имеем честь пригласить Вас принять участие в ежегодном турнире по фехтованию «Элеонора».
  Этот турнир проводится в честь легендарного тренера Элеоноры Михайловны Крутяковой и приурочен к ее
  83-летию. Э. М. Крутякова - единственный тренер по фехтованию на юге России, которая даёт уроки как
  спортивным, так и НЕМА (исторические европейские боевые искусства) фехтовальщикам.
