description: |-
  ⚔ Начинающие фехтовальщики и их тренеры!
  Мы приглашаем вас на турнир “Сила Зверя” 25-26 мая в Челябинске

  Это турнир для новичков, которые занимаются меньше 1 года, где вы получите максимум боевого опыта. Потому что на турнире будут номинации на 4 видах оружия по 8 разным рулсетам. А бои проводятся по швейцарской круговой системе. То есть, все получат одинаковое количество боев, независимо от количества побед.

  Не бойтесь экспериментировать и пробовать все, чему вас научил тренер!
