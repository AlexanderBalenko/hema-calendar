description: |-
  Новый амбициозный проект, объединяющий фехтовальщиков со всех уголков страны.

  Отборочные этапы на севере и юге, на Урале и в Сибири, центральной России и грандиозный праздник фехтования — Турнир Чемпионов в Москве!
  Лучшие, ловкие, сильные и быстрые смогут дойти до финала. Кто же станет лучшим фехтовальщиком по версии турнира — МЕЧ РОССИИ ХЕМА?

  Турнир пройдет в Москве, 20-21 декабря в спортивном зале по адресу ул. Сущевский вал, 56, Москва.
