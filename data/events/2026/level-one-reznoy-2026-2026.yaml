description: |-
  Настала пора расширить географию своего личного HEMA-туризма. Встречайте: впервые, в Вологде, новый турнир из серии Level One - РЕЗНОЙ!

  Этот город - вотчина молодого фехтовального клуба Ravenblade, недавно заявившего о себе HEMA-сообществу. Вороны, чёрно-васильковый цвет, мастерская RB, гостеприимство - уже только ради этого стоит приехать сюда. Вас ждёт комфортный спортивный зал, отличные призы и много фехтования.

  До встречи!
