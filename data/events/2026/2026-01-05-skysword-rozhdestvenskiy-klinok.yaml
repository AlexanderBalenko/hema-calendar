description: |-
  Дорогие друзья, клуб Skysword объявляет об открытии регистрации на рождественский турнир по фехтованию на рапире Ренессанса и Итальянской дуэльной сабле. Турнир пройдет по швейцарской системе в рулсете от Золотого сокола по правилам соответствующих дисциплин.

  📅 Расписание:
  5 января 2026 — Рапира ренессанса
  10:00 - открытие зала
  10:30 - судейский брифинг
  11:00 - Построение
  11:15 - старт боев по Рапире Ренессанса
  18:00 - закрытие зала

  6 января 2026 — Итальянская дуэльная сабля
  10:00 - открытие зала
  10:30 - судейский брифинг
  11:00 - Построение
  11:15 - старт боев по Итальянская дуэльная сабля
  18:00 - закрытие зала

  🎯 Цель турнира:
  Праздничная встреча сообщества, подведение итогов года
  Практика и тренировка судейства в дружеской атмосфере

  ⚠ Важно: Ограничение — 20 человек на номинацию! Спешите регистрироваться!

  🏆 Номинации:
  - Рапира Ренессанса — дубли по одному каждому, приоритет зоны попадания, рубящий не приносит баллов.
  - Итальянская дуэльная сабля — атаки на скрестном шаге допускаются!

  💰 Взнос для гостей: 500 ₽
  🎁 Призовой фонд:
  - Медали от клуба Skysword
  - Бонусный приз от каждого участника — любая приятная мелочь, которой вы захотите порадовать товарищей по оружию! (формируем общий котел из которого каждый получит подарок по порядку в рейтинге)

  Информация о месте проведения турнира, после регистрации, будет направлена на email каждого участника. Либо, его можно уточнить у организаторов, через сообщения в группе VK
