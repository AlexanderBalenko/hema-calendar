description: |-
  Дата:
  • 1 марта 2025 года

  Вас ожидают:
  • длинный меч & кинжал-рондель (М и Ж)
  • меч & баклер (М и Ж)

  Длинный меч по экспериментальным правилам с возможностью использовать кинжал-рондель, закреплённый на поясе.
  Длинные мечи, кинжалы и пояса будут предоставлены организаторами. Также возможно использование собственных, если они будут соответствовать заявленным ТТХ(Лонгсворд до 120см).

  Меч & баклер, который редко встречается на турнирах в РФ, внесём свой вклад в развитие этой номинации и порадуем вас.

  Вся информация в группе ВК: https://vk.com/fechtterra_oldschool
